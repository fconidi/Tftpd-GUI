<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="disc" cx="38%" cy="28%" r="85%">
      <stop offset="0" stop-color="#1e6f8c"/>
      <stop offset="0.55" stop-color="#12395c"/>
      <stop offset="1" stop-color="#091a30"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="plug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f9fc"/>
      <stop offset="1" stop-color="#bcd0de"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd978"/>
      <stop offset="1" stop-color="#e29a1c"/>
    </linearGradient>
    <radialGradient id="led" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#b6ffd2"/>
      <stop offset="1" stop-color="#18c36b"/>
    </radialGradient>
    <clipPath id="clip"><circle cx="64" cy="64" r="60"/></clipPath>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#04101f" flood-opacity="0.55"/>
    </filter>
  </defs>
  <!-- disc -->
  <circle cx="64" cy="64" r="60" fill="url(#disc)"/>
  <g clip-path="url(#clip)">
    <ellipse cx="64" cy="6" rx="58" ry="46" fill="url(#gloss)"/>
    <!-- activity rings around the link LED -->
    <g fill="none" stroke="#5fe3a0">
      <circle cx="95" cy="35" r="13" stroke-width="2.4" opacity="0.55"/>
      <circle cx="95" cy="35" r="19.5" stroke-width="2.2" opacity="0.30"/>
      <circle cx="95" cy="35" r="26" stroke-width="2" opacity="0.14"/>
    </g>
  </g>
  <circle cx="64" cy="64" r="59" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
  <!-- RJ45 plug -->
  <g filter="url(#drop)">
    <path d="M37 50 h16 v-7 h22 v7 h16 a4 4 0 0 1 4 4 v36 a4 4 0 0 1 -4 4 H37 a4 4 0 0 1 -4 -4 V54 a4 4 0 0 1 4 -4 z" fill="url(#plug)"/>
  </g>
  <rect x="40" y="57" width="48" height="25" rx="2.5" fill="#0b2138"/>
  <g fill="url(#gold)">
    <rect x="43.2" y="60" width="3.4" height="18" rx="1.2"/>
    <rect x="48.6" y="60" width="3.4" height="18" rx="1.2"/>
    <rect x="54.0" y="60" width="3.4" height="18" rx="1.2"/>
    <rect x="59.4" y="60" width="3.4" height="18" rx="1.2"/>
    <rect x="64.8" y="60" width="3.4" height="18" rx="1.2"/>
    <rect x="70.2" y="60" width="3.4" height="18" rx="1.2"/>
    <rect x="75.6" y="60" width="3.4" height="18" rx="1.2"/>
    <rect x="81.0" y="60" width="3.4" height="18" rx="1.2"/>
  </g>
  <rect x="45" y="85" width="38" height="3" rx="1.5" fill="#7d97ab" opacity="0.55"/>
  <!-- link LED -->
  <circle cx="95" cy="35" r="7.5" fill="url(#led)" stroke="#06261a" stroke-opacity="0.45" stroke-width="1"/>
  <circle cx="92.6" cy="32.6" r="2.2" fill="#ffffff" opacity="0.7"/>
</svg>
